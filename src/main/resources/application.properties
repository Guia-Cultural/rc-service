spring.application.name=rc-service
spring.profiles.default=dev
spring.config.import=optional:file:./.env[.properties]

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_content_creation=true

jwt.secret-base64=${JWT_SECRET_BASE64:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.upload.dir=${UPLOAD_DIR:uploads}
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:places-media}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

app.seed.demo-users=${APP_SEED_DEMO_USERS:false}
app.seed.demo-places=${APP_SEED_DEMO_PLACES:false}
app.seed.categories=${APP_SEED_CATEGORIES:true}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

server.port=${PORT:8081}
