spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/migration/V1__baseline_schema.sql,classpath:db/migration/V2__mvp_evolution.sql
spring.sql.init.continue-on-error=true

jwt.secret-base64=${JWT_SECRET_BASE64}

app.storage.provider=${APP_STORAGE_PROVIDER:azure}
app.seed.demo-users=false
app.seed.demo-places=false
app.seed.categories=${APP_SEED_CATEGORIES:true}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
