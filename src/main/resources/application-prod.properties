spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

jwt.secret-base64=${JWT_SECRET_BASE64}

app.storage.provider=azure
app.seed.demo-users=false
app.seed.demo-places=false
app.seed.categories=${APP_SEED_CATEGORIES:true}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
